[package]
name = "seabox"
version = "0.1.0"
edition = "2021"
default-run = "seabox"
description = "A standalone Rust sandbox tool using Landlock + seccomp for filesystem and syscall isolation"
license = "MIT"
readme = "README.md"
repository = "https://github.com/zsdfbb/seabox"
keywords = ["sandbox", "landlock", "seccomp", "isolation", "security"]
categories = ["command-line-utilities", "os"]
# `Integration/CodeWhale` 是指向仓库外的悬空符号链接（Linux 开发机上的绝对路径目标），
# `cargo package` 无法归档它（os error 2）。开发文档与集成入口不进入发布物。
exclude = [
    "docs/",
    "Integration/",
    "tmp/",
    "CONTEXT.md",
    "CLAUDE.md",
    "AGENTS.md",
    ".claude/",
]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:dirs"]     # anyhow/libc 恒为核心依赖；landlock 仅 Linux

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
anyhow = "1"                       # 核心，保持
dirs = { version = "6", optional = true }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[[bin]]
name = "seabox"
path = "src/main.rs"
required-features = ["cli"]        # --no-default-features 下二进制不构建

[dev-dependencies]
tempfile = "3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
