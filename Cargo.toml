[package]
name = "sandbox-runtime"
version = "0.1.0"
edition = "2021"
description = "A standalone Rust sandbox tool using Landlock + seccomp for filesystem and syscall isolation"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
dirs = "6"
libc = "0.2"
landlock = "0.4"

[dev-dependencies]
tempfile = "3"
